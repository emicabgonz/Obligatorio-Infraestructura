upstream web_backend {
    # Estrategia de balanceo de carga: Round Robin (por defecto)
    # Otras opciones disponibles: least_conn, ip_hash
    
    # Definir servidores backend
    # Docker Compose creará múltiples instancias del servicio 'web'
    # Docker DNS resolverá 'web' a todas las instancias disponibles
    server web:5000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name localhost;

    # Configuración de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # Buffer configurations para mejorar performance
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Headers que se pasarán al backend
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Configuración para WebSocket (si se necesita en el futuro)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Ruta principal - proxy a las instancias de la aplicación
    location / {
        proxy_pass http://web_backend;
        
        # Headers personalizados en la respuesta
        add_header X-Upstream-Server $upstream_addr always;
        add_header X-Load-Balancer "Nginx-Round-Robin" always;
        add_header X-Response-Time $request_time always;
    }

    # Endpoint de health check
    location /health {
        proxy_pass http://web_backend/health;
        access_log off;
    }

    # Archivos estáticos (CSS, JS, imágenes)
    location /public/ {
        proxy_pass http://web_backend/public/;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Nginx status endpoint para monitoreo (solo accesible desde redes internas)
    location /nginx-status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # Redes Docker
        allow 10.0.0.0/8;     # Redes privadas
        deny all;
    }

    # Manejo de errores
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 503 '{"error": "Service temporarily unavailable", "status": 503}';
        add_header Content-Type application/json;
    }
}
